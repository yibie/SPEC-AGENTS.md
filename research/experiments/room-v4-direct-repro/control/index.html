<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting room reservations</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">Shared spaces</p>
      <h1>Meeting room reservations</h1>
      <p class="intro">Reserve a room for a focused, interruption-free conversation.</p>
    </header>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">New reservation</h2>
      <form id="reservation-form" novalidate>
        <input type="hidden" id="reservation-id">
        <div class="form-grid">
          <label>Topic <input id="topic" name="topic" required maxlength="120" autocomplete="off"></label>
          <label>Person <input id="person" name="person" required maxlength="80" autocomplete="name"></label>
          <label>Date <input id="date" name="date" type="date" required></label>
          <label>Room <select id="room" name="room" required></select></label>
          <label>Start time <input id="start" name="start" type="time" required></label>
          <label>End time <input id="end" name="end" type="time" required></label>
        </div>
        <p id="form-error" class="error" role="alert"></p>
        <div class="actions">
          <button type="submit" id="save-button">Save reservation</button>
          <button type="button" id="clear-button" class="secondary" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section aria-labelledby="list-title">
      <div class="list-heading"><h2 id="list-title">Reservations</h2><span id="count" class="count"></span></div>
      <p id="empty-state" class="empty">No reservations yet.</p>
      <div id="reservation-list" class="reservation-list" aria-live="polite"></div>
    </section>
  </main>

  <dialog id="cancel-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title">Cancel reservation?</h2>
    <p>This reservation will remain visible as cancelled and its time will become available.</p>
    <div class="actions"><button type="button" id="confirm-cancel">Confirm cancellation</button><button type="button" id="dismiss-cancel" class="secondary">Keep reservation</button></div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
